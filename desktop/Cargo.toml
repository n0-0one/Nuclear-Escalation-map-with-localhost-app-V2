[package]
name = "ntl-desktop"
description = "Nuclear Thunder Live - live companion map for War Thunder's Nuclear Escalation"
version.workspace = true
edition.workspace = true

[[bin]]
name = "nuclear-thunder-live"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ntl-engine = { path = "../crates/engine" }
# HTTPS for map-data updates only; uses the operating system's TLS.
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
sha2 = "0.10"
# Unpacking the portable ZIP when the portable copy updates itself.
zip = { version = "2", default-features = false, features = ["deflate"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
