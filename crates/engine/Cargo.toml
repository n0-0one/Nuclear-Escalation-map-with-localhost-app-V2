[package]
name = "ntl-engine"
description = "Battle tracking engine for Nuclear Thunder Live"
version.workspace = true
edition.workspace = true

[lib]
name = "ntl_engine"

[features]
default = ["link"]
# HTTP client for the game's local telemetry port.
link = ["dep:ureq"]
# Development server: hosts the UI in a browser and can stand in for the game.
dev = ["link", "dep:tiny_http"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, optional = true }
tiny_http = { version = "0.12", optional = true }

[[bin]]
name = "ntl-dev"
path = "src/bin/ntl-dev.rs"
required-features = ["dev"]
