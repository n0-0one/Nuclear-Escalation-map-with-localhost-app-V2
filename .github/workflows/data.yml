name: Refresh map data

# Checks the public War Thunder datamine every day. When the event's data
# changed, rebuilds the data pack, proves the engine still works with it and
# publishes it. Installed apps pick it up by themselves.

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
    inputs:
      assets:
        description: "Also rebuild map pictures, terrain and roads"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Rebuild the data pack
        run: python pipeline/update.py ${{ inputs.assets && '--assets' || '' }}
      - name: See what changed
        id: diff
        run: |
          main=false
          feed=false
          git diff --quiet -- data || main=true
          # The feed is stale when it does not exist yet or differs from the fresh pack.
          if git fetch --depth 1 origin data-feed 2>/dev/null; then
            git diff --quiet FETCH_HEAD -- data || feed=true
          else
            feed=true
          fi
          echo "main=$main" >> "$GITHUB_OUTPUT"
          echo "feed=$feed" >> "$GITHUB_OUTPUT"
          if [ "$main" = false ] && [ "$feed" = false ]; then
            echo "Map data is already current." >> "$GITHUB_STEP_SUMMARY"
          else
            git diff --stat -- data >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.diff.outputs.main == 'true' || steps.diff.outputs.feed == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.diff.outputs.main == 'true' || steps.diff.outputs.feed == 'true'
      - name: Prove the engine works with the new data
        if: steps.diff.outputs.main == 'true' || steps.diff.outputs.feed == 'true'
        run: cargo test --release -p ntl-engine
      - name: Publish
        if: steps.diff.outputs.main == 'true' || steps.diff.outputs.feed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          version=$(python -c "import json; print(json.load(open('data/manifest.json'))['game_version'])")
          if [ "${{ steps.diff.outputs.main }}" = true ]; then
            git add data
            git commit -m "Update map data for game version ${version}"
            git push origin HEAD:main
          fi
          # The feed installed apps read: just the data folder, one commit.
          git checkout --orphan feed
          git rm -r --cached . > /dev/null
          git add data
          git commit -m "Map data for game version ${version}" > /dev/null
          git push --force origin feed:data-feed
