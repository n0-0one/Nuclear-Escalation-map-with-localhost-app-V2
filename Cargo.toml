[workspace]
resolver = "2"
members = ["crates/engine"]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/n0-0one/Nuclear-Escalation-map-with-localhost-app-V2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
